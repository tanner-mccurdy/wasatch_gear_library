<!DOCTYPE html>
<!-- Top Start: everything from here through the Nav -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Gear | Wasatch Gear Library</title>
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Nav Start -->
<nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
  <div class="container">
    <a class="navbar-brand fw-bold" href="index.html">&#9650; Wasatch Gear Library</a>
    <ul class="navbar-nav ms-auto flex-row gap-3">
      <li class="nav-item"><a class="nav-link" href="gear.html">Gear</a></li>
      <li class="nav-item"><a class="nav-link" href="members.html">Members</a></li>
      <li class="nav-item"><a class="nav-link" href="checkouts.html">Checkouts</a></li>
      <li class="nav-item"><a class="btn btn-light btn-sm mt-1" href="checkout-new.html">Check Out Gear</a></li>
    </ul>
  </div>
</nav>
<!-- Nav End -->

<main class="container py-4 flex-grow-1">

<!-- Top End -->

<nav class="small mb-2"><a href="gear.html">&larr; Back</a></nav>
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card shadow-sm"><div class="card-body">
      <h1 class="h4 mb-3">Add Gear</h1>

      <form method="POST" action="/gear">
        <div class="mb-3">
          <label class="form-label" for="name">Name</label>
          <input class="form-control" id="name" name="name" value="" required>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label" for="category">Category</label>
            <input class="form-control" id="category" name="category" value="" placeholder="Camping, Hiking, Winter..." required>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label" for="condition">Condition</label>
            <select class="form-select" id="condition" name="condition">
              <option >Excellent</option><option >Good</option><option >Fair</option><option >Needs Repair</option>
            </select>
          </div>
          <div class="col-md-3 mb-3">
            <label class="form-label" for="dailyFee">Daily fee ($)</label>
            <input class="form-control" id="dailyFee" name="dailyFee" type="number" min="0" step="0.5" value="">
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="description">Description</label>
          <textarea class="form-control" id="description" name="description" rows="3"></textarea>
        </div>
        <button class="btn btn-primary">Save</button>
      </form>
    </div></div>
  </div>
</div>

<!-- Bottom Start -->
</main>
<footer class="border-top py-3 mt-auto bg-light">
  <div class="container small text-muted d-flex justify-content-between">
    <span>Wasatch Gear Library &middot; Borrow it, use it, bring it back clean.</span>
    <span>IS 5770/6770 Midterm</span>
  </div>
</footer>
</body>
</html>
<!-- Bottom End -->
